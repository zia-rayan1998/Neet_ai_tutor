<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>NEET AI Tutor</title>
  <style>
    body {
      width: 220px;
      padding: 20px;
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      text-align: center;
    }
    h3 { margin: 0 0 15px 0; }
    .switch {
      position: relative;
      display: inline-block;
      width: 60px;
      height: 30px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #64748b;
      transition: .3s;
      border-radius: 30px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 22px; width: 22px;
      left: 4px; bottom: 4px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: #22c55e; }
    input:checked + .slider:before { transform: translateX(30px); }
    #status {
      margin-top: 12px;
      font-weight: bold;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h3>NEET AI Tutor</h3>
  
  <label class="switch">
    <input type="checkbox" id="toggle">
    <span class="slider"></span>
  </label>
  
  <div id="status">OFF</div>

  <script src="popup.js"></script>
</body>
</html>
